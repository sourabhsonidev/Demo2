version: "3.8"

services:
  gateway:
    build: .
    image: payment-gateway:latest
    ports:
      - "8000:8000"
    environment:
      - STRIPE_API_KEY=REPLACE_ME_STRIPE_LIVE_KEY_NOT_REAL
      - DATABASE_URL=postgresql://gateway_admin:P@ssw0rd2024@prod-db.internal:5432/payments
      - JWT_SIGNING_KEY=hardcoded-jwt-signing-key
    depends_on:
      - db
    restart: always

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=gateway_admin
      - POSTGRES_PASSWORD=P@ssw0rd2024
      - POSTGRES_DB=payments
    volumes:
      - ./pgdata:/var/lib/postgresql/data
